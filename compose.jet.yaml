name: parker-jet
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: parker_jet
      POSTGRES_USER: parker_jet
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55436:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parker_jet -d parker_jet"]
      interval: 1s
      timeout: 3s
      retries: 30

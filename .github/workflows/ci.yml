name: Parker CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: make test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build all packages
        run: make build

  # Component-тесты против PostgreSQL (миграции/пул) — будут дополнены в Фазе 3.
  component:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d parker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PARKER_TEST_DSN: postgres://postgres:postgres@localhost:5432/parker_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run component tests
        run: go test -race -tags=component ./...

  kafka-component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start isolated broker
        run: docker run -d --name kafka -p 19092:19092 redpandadata/redpanda:v24.3.18 redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0 --check=false --kafka-addr 0.0.0.0:19092 --advertise-kafka-addr 127.0.0.1:19092
      - name: Test consumer recovery
        env:
          PARKER_TEST_KAFKA: 127.0.0.1:19092
        run: go test -race -tags=component . -run TestKafka -count=1

  kafka-security-component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify TLS and SCRAM with restricted credentials
        run: scripts/test-kafka-security.sh
